<text x="987" y="529" font-size="16" font-weight="400" fill="#53627a" >Datas após o artefato</text>
<text x="987" y="552" font-size="16" font-weight="400" fill="#53627a" >Estimativas não negativas</text>
<path d="M1096 352V392H488.0V451" stroke="#53627a" stroke-width="1.8" fill="none" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<rect x="666.0" y="374" width="252" height="30" rx="9" fill="#f4f7fb" stroke="none" />
<text x="792.0" y="394" font-size="14" font-weight="500" fill="#53627a" text-anchor="middle">modelo + últimos valores</text>
<circle cx="66" cy="644" r="5" fill="#60a5fa"/>
<text x="83" y="650" font-size="13" font-weight="600" fill="#53627a" letter-spacing="1.0">JANELA DE TREINO CRESCENTE · BASELINE SEMANAL</text>
<path d="M56 708H1224" stroke="#d7e0ec" stroke-width="1"/>
<text x="56" y="738" font-size="17" font-weight="400" fill="#53627a" >Sem valores reais do holdout no horizonte; sem clima futuro observado.</text></g>
