<text x="56" y="55" font-size="14" font-weight="600" fill="#53627a" letter-spacing="1.8">ARCHITECTURE / 02</text>
<text x="56" y="104" font-size="35" font-weight="700" fill="#0b1220" letter-spacing="-0.6">Daily Demand Forecast</text>
<text x="56" y="143" font-size="19" font-weight="400" fill="#53627a" >A avaliação reproduz o horizonte real de uso, sem observar o futuro.</text>
