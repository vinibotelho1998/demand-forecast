name: forecast-checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: pytest -q
      - run: demand-forecast evaluate --data data/demo.csv --source synthetic-seed42 --output /tmp/forecast-report.json

