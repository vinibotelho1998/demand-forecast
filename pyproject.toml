[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-demand-forecast"
version = "0.1.0"
description = "Daily demand forecasting with recursive backtesting and a serving API"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<2",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "joblib>=1.4,<2", "threadpoolctl>=3.5,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
demand-forecast = "demand_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

